services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nornikel-ai-backend
    ports:
      - "8000:8000"
    networks:
      - nornikel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nornikel-ai-frontend
    ports:
      - "8082:80"
    depends_on:
      - backend
    networks:
      - nornikel-network
    restart: unless-stopped

networks:
  nornikel-network:
    driver: bridge
